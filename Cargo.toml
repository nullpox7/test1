[package]
name = "htmx-tasks"
version = "0.1.0"
edition = "2021"
description = "Task manager sample: htmx + Rust (axum) + Askama"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "htmx-tasks"
path = "src/main.rs"

[dependencies]
askama = "0.14"
axum = { version = "0.8", features = ["form", "macros"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower-sessions = { version = "0.14", features = ["memory-store"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
